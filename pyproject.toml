[project]
name = "sme-rm-copilot"
version = "0.1.0"
description = "Reviewer-friendly prototype of an AI copilot for SME relationship managers (fictional bank, mocked systems)."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.4",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.29.0",  # needed by FastAPI's TestClient in the API tests
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["copilot*", "mocks*", "demo*"]

[tool.setuptools.package-data]
"copilot.operations.evals" = ["golden_set.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
# FastAPI's TestClient still uses httpx, which Starlette now flags as deprecated; harmless for this prototype.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
