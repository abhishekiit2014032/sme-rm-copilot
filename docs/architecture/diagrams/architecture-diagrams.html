<style>
:root {
  --ink: #0F2233; --paper: #F6F4EF; --card: #FCFBF8; --line: #C9D2D7; --muted: #4A5866;
  --teal: #0B7A65; --teal-soft: #DCEFE9; --amber: #C98A12; --amber-soft: #F8EBD0; --navy: #0F2233;
  --slate-soft: #E6ECEF; --region: #EAF4F0; --hub: #EEF1F4; --red: #B3261E;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--paper); font-family: Inter, "Segoe UI", Arial, sans-serif; color: var(--ink); padding: 24px; }
.canvas { position: relative; background: var(--paper); margin: 0 auto 48px; overflow: hidden; }
.title { position: absolute; left: 40px; top: 28px; font: 600 40px/1.1 "Space Grotesk", "Segoe UI", Arial, sans-serif; }
.subtitle { position: absolute; left: 40px; top: 80px; font-size: 22px; color: var(--muted); }
.grp { position: absolute; border-radius: 18px; border: 2px solid var(--line); }
.grp > .gl { position: absolute; left: 16px; top: 10px; font-size: 18px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--teal); }
.grp.region { background: var(--region); border: 3px dashed var(--teal); }
.grp.spoke { background: rgba(255,255,255,.35); border-color: #A9D6C7; }
.grp.hub { background: var(--hub); border-color: #C3CDD4; }
.grp.aks { background: rgba(220,239,233,.55); border-color: #8CC7B4; }
.grp.apim { background: rgba(230,236,239,.8); border-color: #AFC0CA; }
.grp.foundry { background: #12293B; border-color: #12293B; }
.grp.foundry > .gl { color: #5FD3B6; }
.grp.onprem { background: #FFFFFF; border: 2px solid var(--ink); }
.grp.onprem > .gl, .grp.ext > .gl { color: var(--ink); }
.grp.ext { background: #FFFFFF; border: 2px dashed #8796A3; }
.grp.bcp { background: var(--amber-soft); border-color: #E6C98A; }
.grp.bcp > .gl { color: #7A4E06; }
.grp.ops { background: #FFFFFF; border-color: var(--line); }
.box { position: absolute; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.box b { font-size: 20px; line-height: 1.2; }
.box span { font-size: 16px; line-height: 1.3; color: var(--muted); }
.box.svc { background: #FFFFFF; border-color: #8CC7B4; }
.box.svc b { font-family: "SFMono-Regular", Consolas, monospace; font-size: 19px; }
.box.gw { background: var(--slate-soft); border-color: #AFC0CA; }
.box.ai { background: #1D3A50; border-color: #1D3A50; }
.box.ai b { color: #EEF2F0; } .box.ai span { color: #AFC2CC; }
.box.data { background: var(--amber-soft); border-color: #E6C98A; }
.box.pass { background: #FFFFFF; border-color: #B9C5CC; }
.box.mock { background: var(--slate-soft); border-color: #AFC0CA; }
.box.mock i { font-style: normal; font-size: 15px; color: var(--teal); font-weight: 600; }
.band { position: absolute; border-radius: 10px; display: flex; align-items: center; padding: 0 18px; font-size: 18px; font-weight: 600; }
.band.pe { background: var(--teal); color: #FFFFFF; }
.band.mon { background: var(--navy); color: #EEF2F0; }
.band.mon em { font-style: normal; color: #5FD3B6; letter-spacing: 1.5px; margin-right: 18px; }
.lbl { position: absolute; font-size: 16px; font-weight: 600; color: var(--teal); background: var(--paper); padding: 1px 6px; border-radius: 6px; }
.lbl.amber { color: #7A4E06; }
.note { position: absolute; font-size: 17px; color: var(--muted); line-height: 1.35; }
.legend { position: absolute; display: flex; gap: 28px; align-items: center; font-size: 17px; color: var(--muted); }
.legend .k { display: inline-flex; align-items: center; gap: 8px; }
.legend .sw { width: 22px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line); display: inline-block; }
svg.wires { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }

const NS = 'http://www.w3.org/2000/svg';
function el(tag, cls, html, style) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (style) e.setAttribute('style', style); return e; }
function pos(x, y, w, h) { return `left:${x}px;top:${y}px;width:${w}px;height:${h}px`; }
function build(id, spec) {
  const c = document.getElementById(id);

  for (const b of spec.bands || []) c.appendChild(el('div', 'band ' + b.cls, b.html, pos(...b.r)));
  for (const b of spec.boxes) c.appendChild(el('div', 'box ' + b.cls, `<b>${b.t}</b>${b.s ? `<span>${b.s}</span>` : ''}${b.i ? `<i>${b.i}</i>` : ''}`, pos(...b.r)));
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'wires'); svg.setAttribute('width', c.style.width); svg.setAttribute('height', c.style.height);
  const defs = document.createElementNS(NS, 'defs');
  for (const [mid, col] of [['h-teal', '#0B7A65'], ['h-grey', '#6B7B88'], ['h-amber', '#B07A10']]) {
    const m = document.createElementNS(NS, 'marker');
    m.setAttribute('id', id + mid); m.setAttribute('viewBox', '0 0 10 10'); m.setAttribute('refX', '9'); m.setAttribute('refY', '5');
    m.setAttribute('markerWidth', '7'); m.setAttribute('markerHeight', '7'); m.setAttribute('orient', 'auto-start-reverse');
    const p = document.createElementNS(NS, 'path'); p.setAttribute('d', 'M0,0 L10,5 L0,10 z'); p.setAttribute('fill', col); m.appendChild(p); defs.appendChild(m);
  }
  svg.appendChild(defs);
  for (const w of spec.wires) {
    const col = w.c === 'grey' ? '#6B7B88' : w.c === 'amber' ? '#B07A10' : '#0B7A65';
    const p = document.createElementNS(NS, 'polyline');
    p.setAttribute('points', w.p.map(q => q.join(',')).join(' '));
    p.setAttribute('fill', 'none'); p.setAttribute('stroke', col); p.setAttribute('stroke-width', w.wd || 3);
    p.setAttribute('stroke-linejoin', 'round'); p.setAttribute('stroke-linecap', 'round');
    if (w.dash) p.setAttribute('stroke-dasharray', '9 7');
    const head = `url(#${id}h-${w.c || 'teal'})`;
    if (w.h !== 'none') p.setAttribute('marker-end', head);
    if (w.h === 'both') p.setAttribute('marker-start', head);
    svg.appendChild(p);
  }
  c.appendChild(svg);
  for (const l of spec.labels || []) c.appendChild(el('div', 'lbl ' + (l.cls || ''), l.t, `left:${l.x}px;top:${l.y}px`));
  for (const n of spec.notes || []) c.appendChild(el('div', 'note', n.t, `left:${n.x}px;top:${n.y}px;width:${n.w}px`));
  if (spec.legend) c.appendChild(el('div', 'legend', spec.legend.html, `left:${spec.legend.x}px;top:${spec.legend.y}px`));
}
